{% extends 'base.html' %}
{% load static %}

{% block title %}Contraseña Actualizada - EntrenoPro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 px-4 sm:px-6 lg:px-8 animate-fade-in">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 sm:p-10 text-center space-y-6">
        <div class="mx-auto h-16 w-16 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 border border-emerald-150">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <div>
            <h1 class="text-2xl font-headline font-extrabold text-slate-800">¡Contraseña actualizada!</h1>
            <p class="mt-2 text-sm text-slate-500 leading-relaxed">
                Tu clave de acceso ha sido modificada con éxito. Puedes continuar utilizando EntrenoPro normalmente.
            </p>
        </div>

        <div>
            <a href="{% url 'users:profile_edit' %}" class="btn-primary inline-flex items-center justify-center w-full px-5 py-3 rounded-xl font-headline font-semibold text-sm transition hover:scale-[1.01] shadow-lg shadow-primary/20 cursor-pointer">
                Volver a Mi Perfil
            </a>
        </div>
    </div>
</div>
{% endblock %}
