{% extends 'base.html' %}
{% load static %}

{% block title %}Contraseña Restablecida - EntrenoPro{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6 bg-white p-8 md:p-10 rounded-2xl shadow-xl border border-slate-200 text-center animate-fade-in">
        <div class="mx-auto h-14 w-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 border border-emerald-200">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <div>
            <h2 class="text-2xl sm:text-3xl font-headline font-extrabold text-slate-800">
                ¡Contraseña Restablecida!
            </h2>
            <p class="mt-3 text-sm text-slate-500 leading-relaxed">
                Tu contraseña ha sido actualizada correctamente. Ya puedes iniciar sesión con tus nuevas credenciales.
            </p>
        </div>
        <div class="pt-2">
            <a href="{% url 'users:login' %}" class="btn-primary w-full min-h-[46px] px-5 py-3 text-sm font-headline font-bold rounded-xl">
                Iniciar Sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
